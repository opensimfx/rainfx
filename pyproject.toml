[project]
name = "rainfx"
version = "0.3.0"
description = "Physically based rain, hail, snow and dew with collisions for Blender"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]          # blender_*.py need bpy and are run as scripts, see docs/DEVELOPMENT.md
